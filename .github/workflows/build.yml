name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Psykit-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Psykit-APK
          path: Psykit-v*.apk

      - name: Release veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # K7: keine zweite Release für denselben Commit, und der Commit-Titel steht im Release-Text
          git fetch --tags --quiet origin || true
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            echo "Für diesen Commit gibt es schon eine Release: $(git tag --points-at "$GITHUB_SHA" | tr '\n' ' ')"
            exit 0
          fi
          TITLE="$(git log -1 --format=%s "$GITHUB_SHA")"
          printf '%s\n\nAPK herunterladen und auf dem Handy öffnen. Neue Versionen lassen sich einfach über die alte installieren, der Spielstand bleibt erhalten.\n' "$TITLE" > notes.txt
          gh release create "v${{ github.run_number }}" "Psykit-v${{ github.run_number }}.apk" \
            --target "$GITHUB_SHA" \
            --title "Psykit Version ${{ github.run_number }}" \
            --notes-file notes.txt
