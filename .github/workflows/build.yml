name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Psykit-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Psykit-APK
          path: Psykit-v*.apk

      - name: Release veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" "Psykit-v${{ github.run_number }}.apk" \
            --title "Psykit Version ${{ github.run_number }}" \
            --notes "APK herunterladen und auf dem Handy öffnen. Neue Versionen lassen sich einfach über die alte installieren, der Spielstand bleibt erhalten."
